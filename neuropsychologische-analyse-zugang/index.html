<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuronal Network - Zugang</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <style>
    :root {
        --bg-color: #000000;
        --card-bg: #0a0a0a;
        --text-main: #f5f5f5;
        --text-muted: #a1a1aa;
        --accent-blue: #38b6ff;
        --accent-blue-glow: rgba(56, 182, 255, 0.2);
        --border-color: #27272a;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 4rem 2rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .access-box {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 2.5rem;
        max-width: 500px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    h1 {
        font-size: 1.8rem;
        margin-bottom: 1rem;
    }

    h1 span {
        color: var(--accent-blue);
    }

    p {
        color: var(--text-muted);
        margin-bottom: 2rem;
    }

    .cta-button {
        display: inline-block;
        background-color: var(--accent-blue);
        color: #000;
        font-weight: 700;
        padding: 1rem 2.5rem;
        border-radius: 4px;
        text-decoration: none;
        cursor: pointer;
        border: none;
        font-size: 1.1rem;
        transition: all 0.2s ease;
        box-shadow: 0 0 20px var(--accent-blue-glow);
    }

    .cta-button:hover {
        opacity: 0.9;
        transform: translateY(-2px);
        box-shadow: 0 0 30px var(--accent-blue-glow);
    }

    .hidden { display: none; }
    .spinner { color: var(--accent-blue); font-size: 1.1rem; }
    .error { color: #ff4d4d; }
  </style>
</head>
<body>

    <div class="access-box">
        <div id="loading-state" class="spinner">
            Überprüfe Zahlung und Berechtigung...
        </div>

        <div id="success-state" class="hidden">
            <h1>Zugang <span>freigeschaltet</span></h1>
            <p>Vielen Dank für deinen Kauf. Deine neuropsychologische Analyse steht für dich bereit.</p>
            <button class="cta-button" onclick="downloadPdf()">PDF herunterladen</button>
        </div>

        <div id="error-state" class="hidden">
            <h1>Zugriff <span>verweigert</span></h1>
            <p class="error">Es wurde keine gültige, bezahlte Session gefunden. Bitte schließe den Kauf ab, um Zugriff zu erhalten.</p>
        </div>
    </div>

    <script>
        let verifiedSessionId = '';

        async function verifyAccess() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');

            if (!sessionId) {
                showError();
                return;
            }

            try {
                const response = await fetch(`https://checkout.neuronal-network-worker.workers.dev/verify?session_id=${sessionId}`);
                const data = await response.json();

                if (data.success) {
                    verifiedSessionId = sessionId;
                    document.getElementById('loading-state').classList.add('hidden');
                    document.getElementById('success-state').classList.remove('hidden');
                } else {
                    showError();
                }
            } catch (err) {
                showError();
            }
        }

        function showError() {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('error-state').classList.remove('hidden');
        }

        function downloadPdf() {
            if (!verifiedSessionId) return;
            window.location.href = `https://checkout.neuronal-network-worker.workers.dev/download?session_id=${verifiedSessionId}`;
        }

        verifyAccess();
    </script>
</body>
</html>
