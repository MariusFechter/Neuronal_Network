<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuronal Network - Checkout</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Stripe SDK -->
    <script src="https://js.stripe.com/v3/"></script>
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y47oniu2gy");
    </script>
    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            box-sizing: border-box;
            padding: 30px 20px;
        }
        /* Produkt-Header im Checkout */
        .checkout-header {
            text-align: left;
            margin-bottom: 25px;
            width: 100%;
        }
        /* Cover jetzt linksbündig statt zentriert, wie auf der LP */
        .checkout-cover-wrapper {
            width: 100%;
            max-width: 140px;
            margin: 0 0 16px 0;
        }
        .checkout-cover-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            border-left: 2px solid rgba(56, 182, 255, 0.3);
            box-shadow: -4px 0 12px rgba(0, 0, 0, 0.9), 0 6px 18px rgba(0, 0, 0, 0.8);
        }
        .product-kicker {
            font-size: 11px;
            font-weight: 700;
            color: #8F8F96;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .product-title {
            font-size: 21px;
            font-weight: 600;
            color: #FFFFFF;
            line-height: 1.3;
            margin: 0;
        }
        .divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.08);
            width: 100%;
            margin: 20px 0;
        }

        /* Trust-Facts-Block: gleicher dünner blauer Strich wie beim Cover-Rahmen */
        .trust-facts-block {
            width: 100%;
            box-sizing: border-box;
            border-left: 2px solid rgba(56, 182, 255, 0.3);
            padding: 16px 0 16px 16px;
            margin-top: 20px;
        }

        .trust-fact-text {
            color: #999999;
            font-size: 13px;
            line-height: 1.5;
            margin: 0 0 10px 0;
        }

        .trust-fact-price {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 14px 0;
        }

        .trust-fact-price .amount {
            color: #ff9900;
        }

        .trust-fact-price .details {
            color: #ffffff;
        }

        .trust-fact-icon-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 9px;
        }

        .trust-fact-icon-line:last-child {
            margin-bottom: 0;
        }

        .trust-fact-icon-line svg {
            width: 14px;
            height: 14px;
            stroke: #666666;
            fill: none;
            flex-shrink: 0;
        }

        .trust-fact-icon-line span {
            color: #999999;
            font-size: 13px;
        }

        .trust-fact-icon-line span.discreet {
            color: #777777;
            font-size: 12px;
            font-style: italic;
        }

        /* Container für das Stripe Formular */
        #checkout {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header mit linksbündigem Cover und Text -->
        <div class="checkout-header">
            <div class="checkout-cover-wrapper">
                <img src="analyse_cover.webp" alt="Analyse Cover" width="300" height="400">
            </div>
            <div class="product-kicker">Neuropsychologische Fachpublikation</div>
            <h1 class="product-title">Rausch oder Realität?</h1>

            <!-- Trust-Facts-Block: Fakten, Preis, Garantie, Diskretion -->
            <div class="trust-facts-block">
                <p class="trust-fact-text">25 Seiten · 27 Quellen · Sofortiger digitaler Zugriff</p>
                <p class="trust-fact-price"><span class="amount">15 €</span> <span class="details">einmalig · kein Abo · keine Folgekosten</span></p>

                <div class="trust-fact-icon-line">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    <span>14 Tage Geld-zurück-Garantie</span>
                </div>
                <div class="trust-fact-icon-line">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
                    <span class="discreet">Diskreter Kauf · neutraler Abbuchungstext</span>
                </div>
            </div>
        </div>
        <div class="divider"></div>
        <!-- HIER WIRD DAS STRIPE FORMULAR GERENDERT -->
        <div id="checkout"></div>
    </div>
    <script>
        const stripe = Stripe('pk_test_51U4GDXADYxGMVTx4vvZvKafbHLQKBg2PHK22xJtCHrMkX6cPO7B3tbeeWQkj6hjaqcx4zgZbIuP6PMjIhXXO5WYz00GYNgSG1r');
        async function initialize() {
            const fetchClientSecret = async () => {
                const response = await fetch("https://stripe-checkout-bridge.theneuronalnetwork.workers.dev", {
                    method: "POST",
                });
                const { clientSecret } = await response.json();
                return clientSecret;
            };
            const checkout = await stripe.initEmbeddedCheckout({
                fetchClientSecret,
            });
            checkout.mount('#checkout');
        }
        initialize();
    </script>
</body>
</html>
