<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuronal Network - Checkout</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Stripe SDK -->
    <script src="https://js.stripe.com/v3/"></script>

    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            box-sizing: border-box;
            padding: 20px;
        }

        /* Container für das reine Stripe Formular */
        #checkout {
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HIER WIRD NUR DAS STRIPE FORMULAR GERENDERT -->
        <div id="checkout"></div>
    </div>

    <script>
        // Deinen Publishable Key mit Anführungszeichen eintragen
        const stripe = Stripe('pk_test_51U4GDXADYxGMVTx4vvZvKafbHLQKBg2PHK22xJtCHrMkX6cPO7B3tbeeWQkj6hjaqcx4zgZbIuP6PMjIhXXO5WYz00GYNgSG1r');

        async function initialize() {
            const fetchClientSecret = async () => {
                const response = await fetch("https://stripe-checkout-bridge.theneuronalnetwork.workers.dev", {
                    method: "POST",
                });
                const { clientSecret } = await response.json();
                return clientSecret;
            };

            const checkout = await stripe.initEmbeddedCheckout({
                fetchClientSecret,
            });

            checkout.mount('#checkout');
        }

        initialize();
    </script>

</body>
</html>
