<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datenschutz - Neuronal Network</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    /* 1. KORREKTUR: Sternchen (*) statt Bindestrich (-) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #a1a1aa; /* Hellgrau für Fließtext */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding: 0.3rem 20px 60px 20px;
    }

    /* Logo zentriert (wie auf LP und Checkout) */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-bottom: 32px;
    }

    .brand-logo img {
      display: block;
      height: auto;
      max-height: 45px;
      width: auto;
      image-rendering: -webkit-optimize-contrast;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    h1 {
      color: #ffffff;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      line-height: 1.2;
    }

    h2 {
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-top: 32px;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    p {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    strong {
      color: #e4e4e7;
      font-weight: 600;
    }

    a {
      color: #38b6ff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:hover {
      color: #60a5fa;
    }

    .section-block {
      margin-bottom: 28px;
    }

    /* Footer Container */
    .site-footer {
      text-align: center;
      margin-top: 60px;
      width: 100%;
    }

    .footer-links-row {
      font-size: 0.656rem;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #8a909c;
      line-height: 2.1;
    }

    .footer-links-row a {
      color: inherit;
      text-decoration: none;
    }

    .footer-links-row a:hover {
      color: #ffffff;
    }

    .footer-brand-name {
      margin-top: 16px;
      font-size: 0.625rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #4b5563;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a class="brand-logo">
      <img
        src="/neurolab-analyse/analyse_logo_neuronal_network.webp"
        alt="Neuronal Network Logo"
        width="120"
        height="120"
        loading="eager"
        decoding="async"
      >
    </a>
  </header>

  <main class="container">
    <!-- Hauptüberschrift -->
    <h1>Datenschutzerklärung</h1>

    <!-- Unterüberschrift & Beispieltext Block 1 -->
    <div class="section-block">
      <h2>x</h2>
      <p>x</p>
    </div>
  </main>

  <!-- 2. KORREKTUR: HTML mit <footer class="site-footer"> umschließen -->
  <footer class="site-footer">
    <div class="footer-links-row">
      <a href="https://www.neuronalnetwork.de/impressum/">Impressum</a>&nbsp;&nbsp;
      <a href="#">Datenschutz</a>&nbsp;&nbsp;
      <a href="#">AGB</a><br>
      <a href="#">Widerrufsbelehrung</a>&nbsp;&nbsp;
      <a href="#">Vertrag widerrufen</a>
    </div>
    <div class="footer-brand-name">Neuronal Network</div>
  </footer>

</body>
</html>
