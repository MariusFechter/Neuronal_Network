<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kompakte Beschreibung deiner Seite für Suchmaschinen">
  <title>Neuronal Network | NeuroLab – Analyse</title>

  <!-- LCP Preload für Logo & Karussell-Cover -->
  <link rel="preload" as="image" href="analyse_logo_neuronal_network.webp" type="image/webp">
  <link rel="preload" fetchpriority="high" as="image" href="Cover.webp" type="image/webp">

  <!-- Favicon-Pfade -->
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    /* Ultra-leichter CSS-Reset & System-Fonts */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #000000;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --max-width: 1080px;
      --spacing-carousel-bottom: 12px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: var(--text-color);
      background-color: var(--bg-color);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin-left: auto;
      margin-right: auto;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    /* Header & Logo Styling */
    .site-header {
      padding: 1rem 0;
      width: 100%;
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo img {
      display: block;
      height: auto;
      max-height: 52px;
      width: auto;
      image-rendering: -webkit-optimize-contrast;
    }

    /* Karussell Styles */
    .carousel-section {
      margin-top: 1.5rem;
    }

    .carousel-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 0 auto var(--spacing-carousel-bottom) auto;
      padding: 0;
      box-sizing: border-box;
      overflow: visible;
    }

    .carousel-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border-radius: 8px;
    }

    .carousel-track::-webkit-scrollbar { 
      display: none; 
    }

    .carousel-slide {
      flex: 0 0 100%;
      width: 100%;
      scroll-snap-align: start;
      padding: 0;
      box-sizing: border-box;
    }

    .carousel-slide img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      border-left: 2px solid rgba(56, 182, 255, 0.3);
      box-shadow: -8px 0 18px rgba(0, 0, 0, 0.9), 0 10px 25px rgba(0, 0, 0, 0.8);
    }

    /* Freistehende Navigation Buttons (Frei von Hintergründen) */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #ffffff;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.9));
      transition: transform 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    }

    .nav-btn.prev { left: -4px; }
    .nav-btn.next { right: -4px; }

    .nav-btn:hover {
      transform: translateY(-50%) scale(1.15);
      color: var(--accent-color);
    }

    .nav-btn.hidden { 
      opacity: 0; 
      pointer-events: none; 
    }

    /* Dots */
    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      transition: all 0.25s ease;
    }

    .dot.active {
      background-color: #38b6ff;
      box-shadow: 0 0 8px rgba(56, 182, 255, 0.6);
      width: 20px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="brand-logo">
        <img 
          src="analyse_logo_neuronal_network.webp" 
          alt="Neuronal Network Logo" 
          width="120" 
          height="120" 
          loading="eager" 
          decoding="async"
        >
      </a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <!-- Preview Karussell -->
        <div class="carousel-section">
          <div class="carousel-wrapper">
            <button class="nav-btn prev hidden" id="prevBtn" aria-label="Vorheriges Bild">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>

            <div class="carousel-track" id="carouselTrack">
              <!-- Slide 1: LCP-Element -->
              <div class="carousel-slide">
                <img src="Cover.webp" alt="Analyse Cover" width="634" height="896" fetchpriority="high" decoding="async">
              </div>

              <!-- Slide 2: Lazy Loading -->
              <div class="carousel-slide">
                <img src="analyse_einblick.webp" alt="Einblick 1" width="634" height="896" loading="lazy" decoding="async">
              </div>

              <!-- Slide 3: Lazy Loading -->
              <div class="carousel-slide">
                <img src="analyse_inhaltsverzeichnis.webp" alt="Einblick 2" width="634" height="896" loading="lazy" decoding="async">
              </div>
            </div>

            <button class="nav-btn next" id="nextBtn" aria-label="Nächstes Bild">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>

            <div class="carousel-dots" id="carouselDots">
              <span class="dot active"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <!-- Footer / Impressum / Datenschutz -->
    </div>
  </footer>

  <!-- Karussell-Steuerung -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const track = document.getElementById('carouselTrack');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const dots = document.querySelectorAll('#carouselDots .dot');

      if (!track) return;

      const updateControls = () => {
        const slideWidth = track.clientWidth;
        const index = Math.round(track.scrollLeft / slideWidth);

        prevBtn.classList.toggle('hidden', index === 0);
        nextBtn.classList.toggle('hidden', index >= dots.length - 1);

        dots.forEach((dot, i) => {
          dot.classList.toggle('active', i === index);
        });
      };

      nextBtn.addEventListener('click', () => {
        track.scrollBy({ left: track.clientWidth, behavior: 'smooth' });
      });

      prevBtn.addEventListener('click', () => {
        track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' });
      });

      track.addEventListener('scroll', updateControls, { passive: true });
    });
  </script>

</body>
</html>
