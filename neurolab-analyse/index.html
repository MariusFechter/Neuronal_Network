<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kompakte Beschreibung deiner Seite für Suchmaschinen">
  <title>Deine Landingpage</title>

  <!-- Favicon-Pfade (Inline SVG-Emoji als Fallback, kann durch favicon.svg ersetzt werden) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    /* Ultra-leichter CSS-Reset & System-Fonts */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #000000;
      --text-color: #f8fafc; /* High-Contrast Off-White für optimale Lesbarkeit */
      --accent-color: #38bdf8;
      --max-width: 1080px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: var(--text-color);
      background-color: var(--bg-color);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin-left: auto;
      margin-right: auto;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <!-- Nav / Branding -->
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <!-- Hero Section -->
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <!-- Footer / Impressum / Datenschutz -->
    </div>
  </footer>

</body>
</html>
