<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>Checkout | Neuronal Network | NeuroLab – Analyse</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png.png">

    <script src="https://js.stripe.com/v3/"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .checkout-container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .field-label { display:block; font-size:14px; margin:20px 0 8px; color:#a1a1aa; }
        #email {
            width:100%; box-sizing:border-box; padding:12px; font-size:16px;
            background:#0a0a0a; color:#fff; border:1px solid #2a2a2a; border-radius:8px;
        }
        #express-checkout { margin-bottom:8px; }
        #pay-btn {
            width:100%; margin-top:20px; padding:16px; font-size:16px; font-weight:600;
            color:#000; background:#fff; border:0; border-radius:8px; cursor:pointer;
        }
        #pay-btn:disabled { opacity:.5; cursor:default; }
        #error { color:#f87171; font-size:14px; margin-top:12px; min-height:20px; }
        .legal { font-size:12px; color:#a1a1aa; margin-top:16px; line-height:1.5; }
        .legal a { color:#a1a1aa; }
    </style>
    
</head>
<body>

    <div class="checkout-container">
        <div id="express-checkout"></div>

        <label class="field-label" for="email">E-Mail (hier schicken wir dir den Download)</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="email@beispiel.de">

        <label class="field-label">Zahlungsmethode</label>
        <div id="payment-element"></div>

        <button id="pay-btn" type="button">Zahlungspflichtig bestellen</button>
        <div id="error" role="alert"></div>

      <p class="legal">
  Du zahlst einmalig 15,00 € (inkl. MwSt.). Kein Abo, keine Folgekosten.<br>
  Es gelten unsere <a href="/agb" target="_blank">AGB</a>. Hier findest du die
  <a href="/widerruf" target="_blank">Widerrufsbelehrung</a> und die
  <a href="/datenschutz" target="_blank">Datenschutzerklärung</a>.
  Du kannst innerhalb von 14 Tagen widerrufen.
</p>
<p class="legal">Sicherer und verschlüsselter Bezahlvorgang über Stripe.</p>
    </div>

<script> 
const stripe = Stripe('pk_test_51U4GDXADYxGMVTx4vvZvKafbHLQKBg2PHK22xJtCHrMkX6cPO7B3tbeeWQkj6hjaqcx4zgZbIuP6PMjIhXXO5WYz00GYNgSG1r');
const BACKEND_URL = 'https://DEIN-BACKEND/create-payment-intent';
const RETURN_URL  = 'https://www.neuronalnetwork.de/neurolab-analyse/danke/';

const elements = stripe.elements({
  mode: 'payment',
  amount: 1500,          // nur Anzeige, der echte Preis wird serverseitig gesetzt
  currency: 'eur',
  locale: 'de',
  appearance: {
    theme: 'night',
    variables: {
      colorPrimary: '#3b82f6',
      colorBackground: '#0a0a0a',
      colorText: '#ffffff',
      colorTextSecondary: '#a1a1aa',
      colorDanger: '#f87171',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
      borderRadius: '8px',
      spacingUnit: '4px'
    }
  }
});

// Express-Buttons (PayPal, Link, Apple/Google Pay, Amazon Pay)
const express = elements.create('expressCheckout', {
  buttonHeight: 48,
  buttonTheme: { applePay: 'white-outline' },
  paymentMethods: {
    paypal: 'auto',
    applePay: 'auto',
    googlePay: 'auto',
    link: 'never',
    amazonPay: 'never',
    klarna: 'never'
  }
});
express.mount('#express-checkout');

// Zahlungsarten (Karte, Klarna, Lastschrift ...). E-Mail kommt aus dem eigenen Feld.
const payment = elements.create('payment', {
  layout: { type: 'accordion', defaultCollapsed: false, radios: true, spacedAccordionItems: false },
  fields: { billingDetails: { email: 'never' } }
});
payment.mount('#payment-element');

const btn = document.getElementById('pay-btn');
const errBox = document.getElementById('error');
const showError = m => { errBox.textContent = m || ''; };

async function createIntent(email) {
  const r = await fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email })
  });
  if (!r.ok) throw new Error('Server nicht erreichbar');
  return (await r.json()).clientSecret;
}

async function pay(email) {
  const { error: submitError } = await elements.submit();
  if (submitError) throw submitError;
  const clientSecret = await createIntent(email);
  const { error } = await stripe.confirmPayment({
    elements, clientSecret,
    confirmParams: {
      return_url: RETURN_URL,
      receipt_email: email,
      payment_method_data: { billing_details: { email } }
    }
  });
  if (error) throw error;
}

btn.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) { showError('Bitte gib eine gültige E-Mail-Adresse ein.'); return; }
  showError(''); btn.disabled = true;
  try { await pay(email); }
  catch (e) { showError(e.message || 'Zahlung fehlgeschlagen.'); btn.disabled = false; }
});

// Express-Zahlung: E-Mail liefert das Wallet selbst
express.on('confirm', async (event) => {
  try {
    const { error: submitError } = await elements.submit();
    if (submitError) throw submitError;
    const email = event.billingDetails?.email;
    const clientSecret = await createIntent(email);
    const { error } = await stripe.confirmPayment({
      elements, clientSecret, confirmParams: { return_url: RETURN_URL }
    });
    if (error) throw error;
  } catch (e) { showError(e.message); }
});
</script>

</body>
</html>
