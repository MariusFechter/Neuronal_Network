<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuronal Network - Checkout</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Stripe SDK -->
    <script src="https://js.stripe.com/v3/"></script>

    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            box-sizing: border-box;
            padding: 30px 20px;
        }

        /* Produkt-Header im Checkout */
        .checkout-header {
            text-align: left;
            margin-bottom: 25px;
            width: 100%;
        }

        .checkout-cover-wrapper {
            width: 100%;
            max-width: 140px;
            margin: 0 auto 16px auto;
        }

        .checkout-cover-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            border-left: 2px solid rgba(56, 182, 255, 0.3);
            box-shadow: -4px 0 12px rgba(0, 0, 0, 0.9), 0 6px 18px rgba(0, 0, 0, 0.8);
        }

        .product-kicker {
            font-size: 11px;
            font-weight: 700;
            color: #8F8F96;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .product-title {
            font-size: 21px;
            font-weight: 600;
            color: #FFFFFF;
            line-height: 1.3;
            margin: 0;
        }

        .divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.08);
            width: 100%;
            margin: 20px 0;
        }

        /* Container für das Stripe Formular */
        #checkout {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header mit zentriertem Cover und linksbündigem Text -->
        <div class="checkout-header">
            <div class="checkout-cover-wrapper">
                <img src="analyse_cover.webp" alt="Analyse Cover" width="300" height="400">
            </div>
            <div class="product-kicker">Neuropsychologische Fachpublikation</div>
            <h1 class="product-title">Rausch oder Realität?</h1>
        </div>

        <div class="divider"></div>

        <!-- HIER WIRD DAS STRIPE FORMULAR GERENDERT -->
        <div id="checkout"></div>
    </div>

    <script>
        const stripe = Stripe('pk_test_51U4GDXADYxGMVTx4vvZvKafbHLQKBg2PHK22xJtCHrMkX6cPO7B3tbeeWQkj6hjaqcx4zgZbIuP6PMjIhXXO5WYz00GYNgSG1r');

        async function initialize() {
            const fetchClientSecret = async () => {
                const response = await fetch("https://stripe-checkout-bridge.theneuronalnetwork.workers.dev", {
                    method: "POST",
                });
                const { clientSecret } = await response.json();
                return clientSecret;
            };

            const checkout = await stripe.initEmbeddedCheckout({
                fetchClientSecret,
            });

            checkout.mount('#checkout');
        }

        initialize();
    </script>

</body>
</html>
