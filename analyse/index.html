<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuronal Network - Analyse</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Preload für das Logo & das LCP-Cover-Bild -->
    <link rel="preload" fetchpriority="high" as="image" href="logo_neuronal_network-3.webp" type="image/webp">
    <link rel="preload" fetchpriority="high" as="image" href="cover.webp" type="image/webp">

    <!-- Preconnect für deinen schnellen Checkout -->
    <link rel="preconnect" href="https://zugang.neuronalnetwork.de">
    <link rel="dns-prefetch" href="https://zugang.neuronalnetwork.de">

    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0px;
            box-sizing: border-box;
        }

        /* Logo */
        .header-logo {
            width: 20%;  
            max-width: 150px;  
            height: auto;  
            object-fit: contain;
            display: block;  
            margin: 10px auto 25px auto;
            transform-origin: center center;
            will-change: transform;
        }

        /* High-Speed Karussell mit Buch-Optik */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 0 auto 30px auto;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .carousel-track {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            border-radius: 8px;
        }

        .carousel-track::-webkit-scrollbar {
            display: none;
        }

        .carousel-slide {
            flex: 0 0 100%;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            box-sizing: border-box;
            padding: 5px;
        }

        /* 3D-Buch-Schatten und Falz via reines CSS */
        .carousel-slide img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            /* Optischer Bucheffekt: Cyan-Kanten-Highlight & Tiefenschatten */
            border-left: 2px solid rgba(56, 182, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 
                -8px 0 18px rgba(0, 0, 0, 0.9), 
                0 10px 25px rgba(0, 0, 0, 0.8),
                0 0 15px rgba(56, 182, 255, 0.08);
        }

        /* Pfeile */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .nav-btn.prev { left: 8px; }
        .nav-btn.next { right: 8px; }

        .nav-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Dots */
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            transition: all 0.25s ease;
        }

        .dot.active {
            background-color: #38b6ff;
            box-shadow: 0 0 8px rgba(56, 182, 255, 0.6);
            width: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <img src="logo_neuronal_network-3.webp" alt="Neuronal Network Logo" class="header-logo" width="150" height="150" fetchpriority="high">

        <!-- Karussell -->
        <div class="carousel-wrapper">
            <button class="nav-btn prev" id="prevBtn" aria-label="Vorheriges Bild">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>

            <div class="carousel-track" id="carouselTrack">
                <div class="carousel-slide">
                    <img src="analyse_cover.webp" alt="Analyse Cover" width="600" height="800" loading="eager" fetchpriority="high">
                </div>
                <div class="carousel-slide">
                    <img src="analyse_einblick.webp" alt="Analyse Einblick 1" width="600" height="800" loading="lazy">
                </div>
                <div class="carousel-slide">
                    <img src="analyse_cover Kopie.webp" alt="Analyse Einblick 2" width="600" height="800" loading="lazy">
                </div>
            </div>

            <button class="nav-btn next" id="nextBtn" aria-label="Nächstes Bild">
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>

            <div class="carousel-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

    </div>

    <!-- Minimal-JS (Inline, 0kb zusätzliche Downloads) -->
    <script>
        const track = document.getElementById('carouselTrack');
        const dots = document.querySelectorAll('.dot');

        function updateDots() {
            const slideWidth = track.clientWidth;
            const currentIndex = Math.round(track.scrollLeft / slideWidth);
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' });
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            track.scrollBy({ left: track.clientWidth, behavior: 'smooth' });
        });

        track.addEventListener('scroll', updateDots);
    </script>

</body>
</html>
