<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuronal Network - Analyse</title>

    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0;
            box-sizing: border-box;
        }

        /* Logo: Abstand radikal reduziert */
        .header-logo {
            width: 8%;  
            max-width: 45px;  
            height: auto;  
            object-fit: contain;
            display: block;  
            margin: 8px auto 8px auto;
        }

        /* Karussell: Deutlich kleiner für 'Above-the-Fold' Sichtbarkeit */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            max-width: 320px; /* Kompakter */
            margin: 0 auto 15px auto;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .carousel-track {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            border-radius: 6px;
        }

        .carousel-track::-webkit-scrollbar { display: none; }

        .carousel-slide {
            flex: 0 0 100%;
            width: 100%;
            scroll-snap-align: start;
            padding: 4px;
            box-sizing: border-box;
        }

        .carousel-slide img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        /* Dots */
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
        }

        .dot.active {
            background-color: #38b6ff;
            width: 16px;
            border-radius: 3px;
        }

        /* Produkt-Head: Noch kompakter */
        .product-header {
            text-align: left;
            max-width: 420px;
            margin: 0 auto;
            padding: 0 15px 15px 15px;
        }

        .product-kicker {
            font-size: 10px;
            font-weight: 700;
            color: #8F8F96;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .product-title {
            font-size: 18px;
            font-weight: 600;
            color: #F5F5F5;
            margin: 0 0 4px 0;
        }

        .product-subtitle {
            font-size: 13px;
            color: #C8C8CD;
            margin: 0;
        }

        /* CTA & Preis */
        .cta-container {
            padding: 0 15px 20px 15px;
            max-width: 420px;
            margin: 0 auto;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 12px;
        }

        .price-amount {
            font-size: 22px;
            font-weight: 700;
            color: #ff9900;
        }

        .cta-button {
            display: block;
            width: 100%;
            background-color: #38b6ff;
            color: #ffffff;
            text-align: center;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(56, 182, 255, 0.2);
        }

        /* Trust */
        .trust-row {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 10px;
            color: #aaaaaa;
        }

        .trust-item { display: flex; align-items: center; gap: 4px; }
        .trust-item svg { width: 12px; height: 12px; stroke: #aaaaaa; }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo_neuronal_network-3.webp" alt="Logo" class="header-logo">

        <div class="carousel-wrapper">
            <div class="carousel-track" id="carouselTrack">
                <div class="carousel-slide"><img src="analyse_cover.webp" alt="Cover"></div>
                <div class="carousel-slide"><img src="analyse_einblick.webp" alt="Inhalt"></div>
            </div>
            <div class="carousel-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
            </div>
        </div>

        <div class="product-header">
            <div class="product-kicker">NEUROPSYCHOLOGISCHE FACHPUBLIKATION</div>
            <h1 class="product-title">Rausch oder Realität?</h1>
            <p class="product-subtitle">Wie Substanzen Wahrnehmung, Emotionen und Verhalten verändern.</p>
        </div>

        <div class="cta-container">
            <div class="price-row">
                <span class="price-amount">15 €</span>
                <span style="font-size: 13px; color: #aaaaaa;">einmalig · kein Abo</span>
            </div>
            <a href="#" class="cta-button">Zugang zur vollständigen Analyse</a>
            <div class="trust-row">
                <div class="trust-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                    Sofort-Zugriff
                </div>
                <div class="trust-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    14 Tage Garantie
                </div>
            </div>
        </div>
    </div>
</body>
</html>
