<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuronal Network - Analyse</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Preload für das LCP-Logo -->
    <link rel="preload" fetchpriority="high" as="image" href="logo_neuronal_network-3.webp" type="image/webp">

    <!-- Preconnect für deinen schnellen Checkout -->
    <link rel="preconnect" href="https://zugang.neuronalnetwork.de">
    <link rel="dns-prefetch" href="https://zugang.neuronalnetwork.de">

    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0px;
            box-sizing: border-box;
        }

        /* Zentriertes Logo sauber integriert */
        .header-logo {
            width: 20%;  
            max-width: 150px;  
            height: auto;  
            object-fit: contain;
            display: block;  
            margin: 10px auto 20px auto;
            transform-origin: center center;
            will-change: transform;
        }

        /* --- Buch-Flip Wrapper Styles --- */
        .book-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 30px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container für das Canvas-Buch */
        #book-container {
            margin: 0 auto;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 15px rgba(56, 182, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
        }

        /* Einzelne Buchseiten */
        .my-page {
            background-color: #000000;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .my-page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Navigationspfeile über dem Buch */
        .book-nav-btn {
            position: absolute;
            top: 45%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .book-nav-btn:active {
            transform: translateY(-50%) scale(0.9);
            background: rgba(56, 182, 255, 0.4);
        }

        .book-nav-btn.prev { left: 5px; }
        .book-nav-btn.next { right: 5px; }

        .book-nav-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Indikator Punkte */
        .carousel-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dot.active {
            background-color: #38b6ff;
            box-shadow: 0 0 10px rgba(56, 182, 255, 0.6);
            width: 22px;
            border-radius: 4px;
        }
    </style>

    <!-- Page-Flip Bibliothek (Sehr leicht & schnell) -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
</head>
<body>

    <div class="container">
        <!-- Zentriertes Logo ganz oben -->
        <img src="logo_neuronal_network-3.webp" alt="Neuronal Network Logo" class="header-logo" width="150" height="150" fetchpriority="high">

        <!-- Interaktiver Buch-Flip -->
        <div class="book-wrapper">
            
            <!-- Pfeil Links -->
            <button class="book-nav-btn prev" id="prevBookBtn" aria-label="Vorherige Seite">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>

            <!-- Das Buch -->
            <div id="book-container">
                <div class="my-page" data-density="hard">
                    <!-- Seite 1: Cover -->
                    <img src="analyse_cover Kopie.webp" alt="Analyse Cover">
                </div>
                <div class="my-page" data-density="soft">
                    <!-- Seite 2: Einblick 1 -->
                    <img src="analyse_cover Kopie.webp" alt="Analyse Einblick 1">
                </div>
                <div class="my-page" data-density="soft">
                    <!-- Seite 3: Einblick 2 -->
                    <img src="analyse_cover Kopie.webp" alt="Analyse Einblick 2">
                </div>
            </div>

            <!-- Pfeil Rechts -->
            <button class="book-nav-btn next" id="nextBookBtn" aria-label="Nächste Seite">
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>

            <!-- Dots -->
            <div class="carousel-dots" id="bookDots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>
        </div>

    </div>

    <!-- Script zur Initialisierung des 3D-Buchs -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pageFlip = new St.PageFlip(document.getElementById('book-container'), {
                width: 380, // Breite einer Seite
                height: 520, // Höhe einer Seite
                size: "fixed",
                minWidth: 280,
                maxWidth: 420,
                minHeight: 380,
                maxHeight: 580,
                maxShadowOpacity: 0.8, // Sorgt für realistischen Schattenwurf
                showCover: true,
                mobileScrollSupport: false // Verhindert ungewolltes Scrollen beim Biegen
            });

            // Seiten aus dem DOM laden
            pageFlip.loadFromHTML(document.querySelectorAll('.my-page'));

            const dots = document.querySelectorAll('.dot');
            const prevBtn = document.getElementById('prevBookBtn');
            const nextBtn = document.getElementById('nextBookBtn');

            // Events für Pfeile
            prevBtn.addEventListener('click', () => {
                pageFlip.flipPrev();
            });

            nextBtn.addEventListener('click', () => {
                pageFlip.flipNext();
            });

            // Dots mit Seitenzahl synchronisieren
            pageFlip.on('flip', (e) => {
                const currentPage = e.data;
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentPage);
                });
            });

            // Klick auf Dots
            dots.forEach(dot => {
                dot.addEventListener('click', (e) => {
                    const targetIndex = parseInt(e.target.getAttribute('data-index'));
                    pageFlip.flip(targetIndex);
                });
            });
        });
    </script>

</body>
</html>
