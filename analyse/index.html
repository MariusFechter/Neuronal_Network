<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuronal Network - Analyse</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Preload für das LCP-Logo -->
    <link rel="preload" fetchpriority="high" as="image" href="logo_neuronal_network-3.webp" type="image/webp">

    <!-- Preconnect für deinen schnellen Checkout -->
    <link rel="preconnect" href="https://zugang.neuronalnetwork.de">
    <link rel="dns-prefetch" href="https://zugang.neuronalnetwork.de">

    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0px;
            box-sizing: border-box;
        }

        /* Zentriertes Logo mit Performance-Glow */
        .header-logo {
            width: 20%;  
            max-width: 150px;  
            height: auto;  
            object-fit: contain;
            display: block;  
            margin: 10px auto 25px auto;

            filter: drop-shadow(0 0 15px rgba(56, 182, 255, 0.15));
            transform-origin: center center;
            will-change: transform;
        }

        @keyframes slowOrbitY {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Zentriertes Logo ganz oben -->
        <img src="logo_neuronal_network-3.webp" alt="Neuronal Network Logo" class="header-logo" width="150" height="150" fetchpriority="high">

        <!-- Hier kommt dein weiterer Content rein -->
    </div>

</body>
</html>
