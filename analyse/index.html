<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuronal Network - Analyse</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Preload für das LCP-Logo -->
    <link rel="preload" fetchpriority="high" as="image" href="logo_neuronal_network-3.webp" type="image/webp">

    <!-- Preconnect für deinen schnellen Checkout -->
    <link rel="preconnect" href="https://zugang.neuronalnetwork.de">
    <link rel="dns-prefetch" href="https://zugang.neuronalnetwork.de">

    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0px;
            box-sizing: border-box;
        }

        /* Zentriertes Logo sauber integriert */
        .header-logo {
            width: 20%;  
            max-width: 150px;  
            height: auto;  
            object-fit: contain;
            display: block;  
            margin: 10px auto 25px auto;
            transform-origin: center center;
            will-change: transform;
        }

        /* --- Preview Karussell Styles --- */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 0 auto 30px auto;
        }

        .carousel-track {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Firefox */
            border-radius: 12px;
        }

        .carousel-track::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .carousel-slide {
            flex: 0 0 100%;
            scroll-snap-align: center;
            box-sizing: border-box;
            padding: 5px;
        }

        .carousel-slide img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: #38b6ff;
            box-shadow: 0 0 8px #38b6ff;
            width: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Zentriertes Logo ganz oben -->
        <img src="logo_neuronal_network-3.webp" alt="Neuronal Network Logo" class="header-logo" width="150" height="150" fetchpriority="high">

        <!-- Preview Karussell -->
        <div class="carousel-wrapper">
            <div class="carousel-track">
                <!-- Slide 1: Hauptcover -->
                <div class="carousel-slide">
                    <img src="analyse_cover.webp" alt="Analyse Cover" width="600" height="800" loading="eager">
                </div>
                <!-- Slide 2: Einblick 1 -->
                <div class="carousel-slide">
                    <img src="einblick_1.webp" alt="Analyse Einblick Inhaltsverzeichnis" width="600" height="800" loading="lazy">
                </div>
                <!-- Slide 3: Einblick 2 -->
                <div class="carousel-slide">
                    <img src="einblick_2.webp" alt="Analyse Einblick Vorschau" width="600" height="800" loading="lazy">
                </div>
            </div>
            
            <!-- Indikator Punkte -->
            <div class="carousel-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

    </div>

</body>
</html>
